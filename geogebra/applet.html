<!doctype html>
<html lang="pl">
<meta charset="utf-8">
<title>Eksport rysunków MatIndeks</title>
<style>body { margin: 0; }</style>
<div id="applet"></div>
<script src="https://www.geogebra.org/apps/deployggb.js"></script>
<script>
  const applet = new GGBApplet({
    appName: 'classic',
    width: 700,
    height: 550,
    perspective: 'G',
    language: 'en',
    showToolBar: false,
    showMenuBar: false,
    showAlgebraInput: false,
    showZoomButtons: false,
    showFullscreenButton: false,
    allowStyleBar: false,
    enableUndoRedo: false,
    fontSize: 22,
    appletOnLoad: api => { window.figureApi = api; },
  }, true);
  applet.setHTML5Codebase('https://www.geogebra.org/apps/5.4.920.0/web3d/');
  applet.inject('applet');
</script>
</html>
